# Raise the locked-memory limit of every systemd user manager (systemd --user), which caps every user unit it starts.
# Needed when vLLM runs under a user unit or anything started from one (tmux, a launcher script). The default hard
# limit (8 MB here) cannot be raised from inside the user session.
# Install: sudo mkdir -p /etc/systemd/system/user@.service.d && sudo cp this file there, then reboot (the running
# user manager keeps its old limit until it restarts). For one user only, use user@<uid>.service.d instead.
[Service]
LimitMEMLOCK=infinity

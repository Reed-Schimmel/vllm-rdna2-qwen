# vLLM CPU KV-cache tier (--kv-offloading-size): keep memory compaction away from the GPU-mapped RAM tier.
# See hwconfig/os/README.md. Install: sudo cp this file /etc/sysctl.d/ && sudo sysctl --system
#
# NAME READS BACKWARD: this asks "may compaction move unevictable (mlocked) pages?". 0 = NO, which is what we want.
# 1 (the kernel default) lets compaction move the vLLM workers' locked memory, and every such move stalls that
# worker's GPU for seconds while the driver re-maps the whole registration.
vm.compact_unevictable_allowed = 0

# Optional, not set: vm.compaction_proactiveness (default 20) = background defragmentation. With the setting above
# it no longer touches the vLLM workers. Set it to 0 only if *another* ROCm compute process (HIP, not Vulkan) on the
# host shows queue evictions: /sys/class/kfd/kfd/proc/<pid>/stats_*/evicted_ms climbing while it runs.
# vm.compaction_proactiveness = 0

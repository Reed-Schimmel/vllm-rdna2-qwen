# Drop-in for the systemd *user* unit that launches vLLM (rename the directory to <your unit>.service.d).
# A unit's own limit defaults to the user manager's; setting it here makes the requirement explicit and survives a
# change of the user-manager default. Install: cp -r to ~/.config/systemd/user/ && systemctl --user daemon-reload
[Service]
LimitMEMLOCK=infinity
